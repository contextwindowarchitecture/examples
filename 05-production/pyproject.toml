[project]
name = "cwa-example-production"
version = "0.1.0"
description = "The agent made production-shaped: a snapshot store, OpenTelemetry traces, evals and a deployment gate"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "llama-index-core>=0.14",
    "llama-index-retrievers-bm25>=0.8",
    "anthropic>=1",
    "openai>=2",
    "mcp>=2.2",
    "jsonschema>=4.26.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[tool.uv]
package = false

# The assembler is a draft release on GitHub, not yet on PyPI. Pinned to its tag, so `uv sync` is all a reader runs.
[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
