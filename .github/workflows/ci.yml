# Every example's suite on every supported Python. The suite rebuilds each committed scenario from its inputs and
# assembles it, so a change to a help-center article, the instructions, the route policy or the assembler pin fails
# here until the scenarios are regenerated and the context diff is committed for review. No model is called.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  docs-qa:
    name: 01-docs-qa (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: 01-docs-qa
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
