# The models to benchmark and how to run them (README.md). Model IDs are OpenRouter's, sent as written. The key is read
# from the variable key_env names; `uv run --env-file .env ...` reads it from bench/.env, which git ignores.

models = [
  "inclusionai/ling-3.1-flash",
  "qwen/qwen3.8-27b",
  "nvidia/nemotron-3.5-lightning:free",
  "google/gemma-4-31b-it",
  "x-ai/grok-4.7",
  "anthropic/claude-sonnet-5.5",
  "openai/gpt-6.1-sol-pro",
  "deepseek/deepseek-v4.1-flash",
  "deepseek/deepseek-v4-pro-0813",
  "meta-llama/llama-3.1-8b-instruct",
  "mistralai/ministral-8b-2512",
  "google/gemini-3.8-flash",
  "openai/gpt-6-luna",
  "cohere/command-a-plus",
]

[openrouter]
key_env = "OPENROUTER_API_KEY"

[run]
examples = ["01-docs-qa", "02-account-aware", "03-budget-and-routes", "04-tools", "05-production"]
repeats = 10
concurrency = 4         # paid models; free models run one call at a time
max_cost_usd = 30.0     # no case starts once the run has spent this
confirm = true          # show the plan and its estimate, and wait for a yes
