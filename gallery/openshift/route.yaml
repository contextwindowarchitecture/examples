# The custom route: your own hostname, TLS at the router, plain HTTP redirected. Point the hostname's DNS at the
# router (README: On OpenShift). Without a certificate here the router serves its default one, which covers
# *.apps.<cluster> only, so a custom hostname needs its own (README: A certificate for the hostname).
# LetsEncrypt certificate is best option but requires manual renewal
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cwa-gallery-viewer
spec:
  host: gallery.contextwindowarchitecture.io
  to:
    kind: Service
    name: cwa-gallery-viewer
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
