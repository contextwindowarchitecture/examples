# The router reads the certificate from the secret itself (Route spec.tls.externalCertificate), so its service account
# may read that one secret in this project, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cwa-gallery-viewer-tls-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cwa-gallery-viewer-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cwa-gallery-viewer-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
roleRef:
  kind: Role
  name: cwa-gallery-viewer-tls-reader
  apiGroup: rbac.authorization.k8s.io
