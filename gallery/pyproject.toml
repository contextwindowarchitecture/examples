[project]
name = "cwa-gallery"
version = "0.1.0"
description = "Shows the examples at work on a list of models from OpenRouter: what CWA decided and what each model did with it"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Standard library only: the harness runs each example in the example's own environment, and needs nothing itself.
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
